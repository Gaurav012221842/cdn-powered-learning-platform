spring.application.name=video-worker
server.port=${PORT:8081}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.properties.reconnect.backoff.ms=10000
spring.kafka.consumer.properties.reconnect.backoff.max.ms=30000
logging.level.org.apache.kafka.clients.NetworkClient=ERROR

cloudflare.r2.endpoint=${R2_ENDPOINT:https://account-id.r2.cloudflarestorage.com}
cloudflare.r2.access-key=${R2_ACCESS_KEY:dev-access-key}
cloudflare.r2.secret-key=${R2_SECRET_KEY:dev-secret-key}
cloudflare.r2.bucket-name=${R2_BUCKET_NAME:learning-platform}
cloudflare.r2.cdn-url=${R2_CDN_URL:}
