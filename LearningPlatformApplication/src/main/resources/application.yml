spring:
  profiles:
    active: dev
  application:
    name: LearningPlatformApplication
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:2GB}
      max-request-size: ${MAX_REQUEST_SIZE:2GB}
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/learning_platform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 180000
      keepalive-time: 60000
      connection-timeout: 30000
      idle-timeout: 120000
      minimum-idle: 2
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    ignore-missing-migrations: true
    validate-on-migrate: false
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      username: ${SPRING_REDIS_USERNAME:default}
      password: ${SPRING_REDIS_PASSWORD:}
      ssl:
        enabled: ${SPRING_REDIS_SSL_ENABLED:false}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    admin:
      auto-create: true
      fail-fast: false
      properties:
        default.api.timeout.ms: 3000
        request.timeout.ms: 3000

server:
  port: ${PORT:8080}
  address: 0.0.0.0

site:
  name: Gaurav
  title: Gaurav's CDN Learning Platform
  owner: Gaurav
  supportEmail: serversidegaurav@gmail.com
  masterAdminEmail: ${MASTER_ADMIN_EMAIL:serversidegaurav@gmail.com}
  defaultTheme: light

app:
  base-url: ${APP_BASE_URL:${RENDER_EXTERNAL_URL:http://localhost:8080}}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  security:
    master-admin-email: ${MASTER_ADMIN_EMAIL:serversidegaurav@gmail.com}

jwt:
  secret: ${JWT_SECRET:default_jwt_secret_key_for_development_environment_only}
  expiration: ${JWT_EXPIRATION:86400000}

cloudflare:
  r2:
    endpoint: ${R2_ENDPOINT:https://account-id.r2.cloudflarestorage.com}
    access-key: ${R2_ACCESS_KEY:dev-access-key}
    secret-key: ${R2_SECRET_KEY:dev-secret-key}
    bucket-name: ${R2_BUCKET_NAME:learning-platform}
    cdn-url: ${R2_CDN_URL:}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_mockkey123}
  key-secret: ${RAZORPAY_KEY_SECRET:mocksecret123}

brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:${SPRING_MAIL_USERNAME:serversidegaurav@gmail.com}}
  sender-name: ${BREVO_SENDER_NAME:${site.title:Gaurav's CDN Learning Platform}}

local:
  uploads-url: ${LOCAL_UPLOADS_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
      sla:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s

