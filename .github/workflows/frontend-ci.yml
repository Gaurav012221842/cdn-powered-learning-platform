name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'learningapplicationfrontend/**'
  pull_request:
    branches: [ main, develop ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: 'learningapplicationfrontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd learningapplicationfrontend
          npm ci

      - name: Build React Application
        run: |
          cd learningapplicationfrontend
          npm run build --if-present
