version: '3.8'

services:
  learning-platform-db:
    image: postgres:15-alpine
    container_name: prod-learning-platform-db
    restart: always
    environment:
      POSTGRES_DB: learning_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    ports:
      - "5433:5432"
    volumes:
      - prod-pgdata:/var/lib/postgresql/data

  learning-platform-redis:
    image: redis:7-alpine
    container_name: prod-learning-platform-redis
    restart: always
    ports:
      - "6379:6379"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: prod-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: prod-kafka
    restart: always
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  backend-app:
    build:
      context: "../../LearningPlatformApplication"
      dockerfile: Dockerfile
    container_name: prod-backend-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://learning-platform-db:5432/learning_platform
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
      SPRING_REDIS_HOST: learning-platform-redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:rzp_test_mockkey123}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:mocksecret123}
    depends_on:
      - learning-platform-db
      - learning-platform-redis
      - kafka

  video-worker:
    build:
      context: "../../video-worker"
      dockerfile: Dockerfile
    container_name: prod-video-worker
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - kafka

  frontend-app:
    build:
      context: "../../learningapplicationfrontend"
      dockerfile: Dockerfile
    container_name: prod-frontend-app
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend-app

  prometheus:
    image: prom/prometheus:latest
    container_name: prod-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend-app

  grafana:
    image: grafana/grafana:latest
    container_name: prod-grafana
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - prod-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prod-pgdata:
  prod-grafana-data:
