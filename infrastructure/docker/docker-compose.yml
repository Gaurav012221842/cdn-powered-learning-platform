version: '3.8'
# Infrastructure base docker-compose for local development
services:
  db:
    image: postgres:15-alpine
    container_name: dev-postgres
    ports:
      - "5433:5433"
    environment:
      POSTGRES_DB: learning_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword

  redis:
    image: redis:7-alpine
    container_name: dev-redis
    ports:
      - "6379:6379"

  app:
    image: learning-platform-backend:local
    build:
      context: ../../LearningPlatformApplication
      dockerfile: Dockerfile
    container_name: local-learning-platform-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/learning_platform
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SPRING_REDIS_HOST: redis
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      - db
      - redis
